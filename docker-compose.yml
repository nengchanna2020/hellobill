# Local services for HelloBill. Start them with: docker compose up -d
#   Postgres  -> localhost:5432 (database, user and password are all "hellobill";
#                a read-only login, hellobill_readonly / readonly, for the db MCP server)
#   Mailpit   -> fake inbox at http://localhost:8025, SMTP on localhost:1025
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hellobill
      POSTGRES_USER: hellobill
      POSTGRES_PASSWORD: hellobill
    ports:
      - "5432:5432"
    volumes:
      - hellobill-db:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellobill -d hellobill"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  hellobill-db:
